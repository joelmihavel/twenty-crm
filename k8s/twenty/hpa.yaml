apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: twenty-server
  namespace: twenty-prod
  labels:
    app: twenty-server
    app.kubernetes.io/part-of: twenty
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: twenty-server
  minReplicas: 3
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: twenty-worker
  namespace: twenty-prod
  labels:
    app: twenty-worker
    app.kubernetes.io/part-of: twenty
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: twenty-worker
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
