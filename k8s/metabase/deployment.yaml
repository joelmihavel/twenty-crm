apiVersion: apps/v1
kind: Deployment
metadata:
  name: metabase
  namespace: twenty-prod
  labels:
    app: metabase
    app.kubernetes.io/name: metabase
    app.kubernetes.io/part-of: twenty
    app.kubernetes.io/component: analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metabase
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: metabase
        app.kubernetes.io/name: metabase
        app.kubernetes.io/part-of: twenty
        app.kubernetes.io/component: analytics
    spec:
      serviceAccountName: twenty-server
      terminationGracePeriodSeconds: 30
      containers:
        - name: metabase
          image: metabase/metabase:v0.53.8
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: MB_DB_TYPE
              value: "h2"
            - name: MB_JETTY_PORT
              value: "3000"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1500m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.0
          args:
            - "--structured-logs"
            - "--private-ip"
            - "--port=5432"
            - "flent-twenty-prod:asia-south1:flent-twenty-db-replica"
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
