steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'packages/twenty-docker/twenty/Dockerfile'
      - '--target'
      - 'twenty'
      - '-t'
      - 'asia-south1-docker.pkg.dev/flent-twenty-prod/flent-twenty/twenty:${SHORT_SHA}'
      - '-t'
      - 'asia-south1-docker.pkg.dev/flent-twenty-prod/flent-twenty/twenty:latest'
      - '.'
    timeout: '1800s'

images:
  - 'asia-south1-docker.pkg.dev/flent-twenty-prod/flent-twenty/twenty:${SHORT_SHA}'
  - 'asia-south1-docker.pkg.dev/flent-twenty-prod/flent-twenty/twenty:latest'

options:
  machineType: 'E2_HIGHCPU_32'
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY

timeout: '2400s'
