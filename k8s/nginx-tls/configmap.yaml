apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-tls-config
  namespace: twenty-prod
data:
  default.conf: |
    # ─── hawkeye.flent.in — Hawkeye frontend + Twenty backend APIs ────
    server {
        listen 443 ssl;
        server_name hawkeye.flent.in;

        ssl_certificate /etc/nginx/ssl/tls.crt;
        ssl_certificate_key /etc/nginx/ssl/tls.key;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Twenty backend API endpoints (needed by Hawkeye's BFF proxy)
        location /graphql {
            proxy_pass http://twenty-server:3000;
        }

        location /metadata {
            proxy_pass http://twenty-server:3000;
        }

        location /rest/ {
            proxy_pass http://twenty-server:3000;
        }

        location /files/ {
            proxy_pass http://twenty-server:3000;
        }

        location /healthz {
            proxy_pass http://twenty-server:3000;
        }

        # Everything else → Hawkeye (Next.js) including /invite, /login, /bff, pages
        location / {
            proxy_pass http://hawkeye:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ─── crmops-hawkeye.flent.in — Twenty native admin UI ─────────────
    server {
        listen 443 ssl;
        server_name crmops-hawkeye.flent.in;

        ssl_certificate /etc/nginx/ssl/tls.crt;
        ssl_certificate_key /etc/nginx/ssl/tls.key;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # All paths → Twenty server (frontend + API in one)
        location / {
            proxy_pass http://twenty-server:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ─── HTTP port 80 — mirror both hosts (Cloudflare fallback) ───────
    server {
        listen 80;
        server_name hawkeye.flent.in;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /graphql { proxy_pass http://twenty-server:3000; }
        location /metadata { proxy_pass http://twenty-server:3000; }
        location /rest/ { proxy_pass http://twenty-server:3000; }
        location /files/ { proxy_pass http://twenty-server:3000; }
        location /healthz { proxy_pass http://twenty-server:3000; }

        location / {
            proxy_pass http://hawkeye:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    server {
        listen 80;
        server_name crmops-hawkeye.flent.in;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location / {
            proxy_pass http://twenty-server:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
