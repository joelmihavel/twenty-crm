apiVersion: apps/v1
kind: Deployment
metadata:
  name: twenty-worker
  namespace: twenty-prod
  labels:
    app: twenty-worker
    app.kubernetes.io/part-of: twenty
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: twenty-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: twenty-worker
        app.kubernetes.io/part-of: twenty
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: twenty-server
      nodeSelector:
        pool: worker
      tolerations:
        - key: cloud.google.com/gke-spot
          operator: Equal
          value: "true"
          effect: NoSchedule
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: twenty-worker
          image: twentycrm/twenty:latest
          command: ["yarn", "worker:prod"]
          env:
            - name: SERVER_URL
              value: "https://crm.flent.in"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=8192"
            - name: PG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: twenty-secrets
                  key: PG_DATABASE_URL
            - name: REDIS_URL
              value: "rediss://10.96.135.84:6378"
            - name: PG_DATABASE_PRIMARY_TIMEOUT_MS
              value: "5000"
            - name: PG_POOL_MAX_CONNECTIONS
              value: "50"
            - name: API_RATE_LIMITING_SHORT_LIMIT
              value: "500"
            - name: API_RATE_LIMITING_LONG_LIMIT
              value: "2000"
            - name: STORAGE_TYPE
              value: "s3"
            - name: STORAGE_S3_REGION
              value: "asia-south1"
            - name: STORAGE_S3_NAME
              value: "flent-twenty-files"
            - name: STORAGE_S3_ENDPOINT
              value: "https://storage.googleapis.com"
            - name: STORAGE_S3_ACCESS_KEY_ID
              value: "GOOG1EHDACLGKUVHQT6IGYZFXNP747Q3POXHGY6C264NI23NJHEDB6LGCKGOL"
            - name: STORAGE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: twenty-secrets
                  key: HMAC_SECRET
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: twenty-secrets
                  key: APP_SECRET
            - name: EMAIL_FROM_ADDRESS
              value: "crm@flent.in"
            - name: AUTH_GOOGLE_ENABLED
              value: "true"
            - name: MESSAGING_PROVIDER_GMAIL_ENABLED
              value: "true"
            - name: CALENDAR_PROVIDER_GOOGLE_ENABLED
              value: "true"
            - name: IS_MULTIWORKSPACE_ENABLED
              value: "false"
            - name: DISABLE_DB_MIGRATIONS
              value: "true"
            - name: DISABLE_CRON_JOBS_REGISTRATION
              value: "true"
            - name: NODE_EXTRA_CA_CERTS
              value: "/etc/ssl/redis/redis-ca.pem"
          volumeMounts:
            - name: redis-ca-cert
              mountPath: /etc/ssl/redis
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            exec:
              command: ["node", "-e", "process.exit(0)"]
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            exec:
              command: ["node", "-e", "process.exit(0)"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
      volumes:
        - name: redis-ca-cert
          secret:
            secretName: redis-ca-cert
