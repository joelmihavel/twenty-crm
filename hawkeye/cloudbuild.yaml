steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile'
      - '-t'
      - 'asia-south1-docker.pkg.dev/flent-twenty-prod/hawkeye/hawkeye:${SHORT_SHA}'
      - '-t'
      - 'asia-south1-docker.pkg.dev/flent-twenty-prod/hawkeye/hawkeye:latest'
      - '.'
    timeout: '1200s'

images:
  - 'asia-south1-docker.pkg.dev/flent-twenty-prod/hawkeye/hawkeye:${SHORT_SHA}'
  - 'asia-south1-docker.pkg.dev/flent-twenty-prod/hawkeye/hawkeye:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 50
  logging: CLOUD_LOGGING_ONLY

timeout: '1800s'
