apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: twenty-prod
  labels:
    app: pgbouncer
    app.kubernetes.io/part-of: twenty
    app.kubernetes.io/component: database-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgbouncer
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: pgbouncer
        app.kubernetes.io/part-of: twenty
        app.kubernetes.io/component: database-proxy
    spec:
      serviceAccountName: twenty-server
      nodeSelector:
        pool: server
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: generate-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              DB_PASS=$(cat /secrets/DB_PASSWORD)
              # Store plaintext password so PgBouncer can authenticate upstream with SCRAM-SHA-256
              echo "\"twenty\" \"${DB_PASS}\"" > /etc/pgbouncer-generated/userlist.txt
              # Copy pgbouncer.ini from configmap
              cp /etc/pgbouncer-cm/pgbouncer.ini /etc/pgbouncer-generated/pgbouncer.ini
              chmod 644 /etc/pgbouncer-generated/userlist.txt
              chmod 644 /etc/pgbouncer-generated/pgbouncer.ini
          volumeMounts:
            - name: pgbouncer-generated
              mountPath: /etc/pgbouncer-generated
            - name: db-password
              mountPath: /secrets
            - name: pgbouncer-config
              mountPath: /etc/pgbouncer-cm
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:v1.25.1-p0
          ports:
            - containerPort: 6432
              name: pgbouncer
              protocol: TCP
          volumeMounts:
            - name: pgbouncer-generated
              mountPath: /etc/pgbouncer
              readOnly: true
          livenessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.0
          args:
            - "--structured-logs"
            - "--private-ip"
            - "--port=5432"
            - "flent-twenty-prod:asia-south1:flent-twenty-db"
          ports:
            - containerPort: 5432
              name: postgres
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
      volumes:
        - name: pgbouncer-config
          configMap:
            name: pgbouncer-config
        - name: pgbouncer-generated
          emptyDir: {}
        - name: db-password
          secret:
            secretName: twenty-secrets
            items:
              - key: DB_PASSWORD
                path: DB_PASSWORD
